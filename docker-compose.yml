services:
  kruschdb:
    image: pgvector/pgvector:pg16
    container_name: kruschdb-mcp
    restart: always
    environment:
      POSTGRES_USER: krusch
      POSTGRES_PASSWORD: password  # Local development default — override via .env
      POSTGRES_DB: kruschdb
    ports:
      - "${PGPORT:-5432}:5432"
    volumes:
      - kruschdb_data:/var/lib/postgresql/data
      - ./db/schema.sql:/docker-entrypoint-initdb.d/01-init.sql:ro

  # Optional: Ollama container for local embeddings if not running natively on host
  # ollama:
  #   image: ollama/ollama
  #   container_name: ollama-mcp
  #   ports:
  #     - "11434:11434"
  #   volumes:
  #     - ollama_data:/root/.ollama
  #   # To initialize models after starting:
  #   # docker exec -it ollama-mcp ollama run bge-large
  #   # docker exec -it ollama-mcp ollama run llama3.2

volumes:
  kruschdb_data:
  # ollama_data:

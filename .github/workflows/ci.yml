name: KruschContext CI

on:
  push:
    branches: [ main ]
  pull_request:
    branches: [ main ]
  workflow_dispatch:

jobs:
  test:
    name: Test Suite (Node 22)
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Node.js 22.x
        uses: actions/setup-node@v4
        with:
          node-version: 22.x
          cache: 'npm'

      - name: Install dependencies
        run: npm ci

      - name: Run Test Suite
        env:
          MOCK_EMBEDDINGS: "1"
        run: |
          npm test 2>&1 | tee test.log

      - name: Instant Failure Push Notification
        if: failure()
        env:
          NTFY_TOPIC_URL: ${{ secrets.NTFY_TOPIC_URL }}
        run: |
          if [ -n "${NTFY_TOPIC_URL:-}" ]; then
            ERR_SNIPPET=$(tail -n 25 test.log 2>/dev/null || echo "No test log found")
            curl -s -X POST \
              -H "Title: 🚨 CI Failure: ${{ github.repository }} (Node 22)" \
              -H "Priority: urgent" \
              -H "Tags: rotating_light,x" \
              -H "Click: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}" \
              -d "Run #${{ github.run_number }} failed on $GITHUB_REF_NAME. Commit: ${{ github.sha }} by $GITHUB_ACTOR. $ERR_SNIPPET" \
              "${NTFY_TOPIC_URL}" || true
          fi

      - name: Dispatch Webhook Alert (Optional)
        if: failure() && env.CI_WEBHOOK != ''
        env:
          CI_WEBHOOK: ${{ secrets.CI_FAILURE_WEBHOOK }}
        run: |
          curl -s -X POST -H "Content-Type: application/json" \
            -d "{\"content\": \"🚨 **CI Failure**: [${{ github.repository }}#${{ github.run_number }}](${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}) failed on '$GITHUB_REF_NAME' (Commit: '$GITHUB_SHA')\"}" \
            "$CI_WEBHOOK" || true
